<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emby Router · 控制面</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
    <style>
      /* ============ COSS UI 风设计令牌 ============ */
      :root {
        --color-bg: #fafafa;
        --color-surface: #ffffff;
        --color-surface-2: #f5f5f5;
        --color-surface-hover: #f0f0f0;
        --color-border: rgba(0, 0, 0, 0.08);
        --color-border-strong: rgba(0, 0, 0, 0.12);
        --color-text: #0a0a0a;
        --color-text-muted: #525252;
        --color-text-soft: #a3a3a3;
        --color-primary: #18181b;
        --color-primary-hover: #27272a;
        --color-primary-fg: #ffffff;
        --color-accent: #6366f1;
        --color-success: #16a34a;
        --color-success-bg: rgba(22, 163, 74, 0.1);
        --color-danger: #dc2626;
        --color-danger-bg: rgba(220, 38, 38, 0.1);
        --color-warn-bg: rgba(234, 179, 8, 0.12);

        --btn-from: #27272a;
        --btn-to: #0a0a0a;
        --btn-ring: rgba(0, 0, 0, 0.08);

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --radius-2xl: 20px;

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);

        --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -1px 0 rgba(0, 0, 0, 0.04);
        --btn-inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      }
      [data-theme="dark"] {
        --color-bg: #09090b;
        --color-surface: #18181b;
        --color-surface-2: #1f1f23;
        --color-surface-hover: #27272a;
        --color-border: rgba(255, 255, 255, 0.08);
        --color-border-strong: rgba(255, 255, 255, 0.14);
        --color-text: #fafafa;
        --color-text-muted: #a1a1aa;
        --color-text-soft: #71717a;
        --color-primary: #fafafa;
        --color-primary-hover: #ffffff;
        --color-primary-fg: #09090b;
        --color-accent: #818cf8;
        --color-success: #4ade80;
        --color-success-bg: rgba(74, 222, 128, 0.14);
        --color-danger: #f87171;
        --color-danger-bg: rgba(248, 113, 113, 0.14);
        --color-warn-bg: rgba(250, 204, 21, 0.14);

        --btn-from: #fafafa;
        --btn-to: #d4d4d8;
        --btn-ring: rgba(255, 255, 255, 0.06);

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.6);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);

        --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
        --btn-inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      }

      /* ============ 基础 ============ */
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Helvetica Neue", sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        transition: background 0.2s, color 0.2s;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      /* ============ Header ============ */
      header {
        background: color-mix(in oklab, var(--color-surface) 80%, transparent);
        border-bottom: 1px solid var(--color-border);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: saturate(180%) blur(12px);
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stats {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: var(--color-text-muted);
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
      }

      /* ============ 按钮 ============ */
      .btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        color: var(--color-text);
        transition: transform 0.08s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:active { transform: translateY(1px); }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: none;
      }
      .btn:disabled:active { transform: none; }
      .btn-icon {
        background: var(--color-surface);
        border-color: var(--color-border);
        color: var(--color-text-muted);
        box-shadow: var(--shadow-xs);
      }
      .btn-icon:hover {
        color: var(--color-text);
        background: var(--color-surface-hover);
        border-color: var(--color-border-strong);
      }
      .btn-primary {
        background: linear-gradient(to bottom, var(--btn-from), var(--btn-to));
        color: var(--color-primary-fg);
        border-color: var(--btn-ring);
        box-shadow: var(--btn-inner-shadow), var(--shadow-sm);
        padding: 10px 16px;
        font-weight: 600;
      }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-ghost {
        background: var(--color-surface);
        border-color: var(--color-border);
        color: var(--color-text);
        font-size: 12px;
        padding: 6px 11px;
      }
      .btn-ghost:hover { background: var(--color-surface-hover); border-color: var(--color-border-strong); }
      .btn-danger {
        background: transparent;
        border-color: var(--color-border);
        color: var(--color-danger);
        font-size: 12px;
        padding: 6px 11px;
      }
      .btn-danger:hover { background: var(--color-danger-bg); border-color: var(--color-danger); }

      /* ============ 主区 ============ */
      main { max-width: 1200px; margin: 0 auto; padding: 28px; }

      /* ============ Tabs（segmented） ============ */
      .tabs {
        display: inline-flex;
        gap: 2px;
        margin-bottom: 20px;
        background: var(--color-surface);
        padding: 4px;
        border-radius: 999px;
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-xs);
      }
      .tabs button {
        background: transparent;
        border: none;
        padding: 7px 18px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--color-text-muted);
        border-radius: 999px;
        font-family: inherit;
        transition: all 0.15s;
      }
      .tabs button:hover { color: var(--color-text); }
      .tabs button.active {
        background: var(--color-primary);
        color: var(--color-primary-fg);
        box-shadow: var(--shadow-xs);
      }

      /* ============ Card / Panel ============ */
      .panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
      }
      .panel + .panel { margin-top: 16px; }
      .panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 18px;
        letter-spacing: -0.01em;
      }
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .toolbar h2 { margin: 0 !important; flex: 1; }

      /* ============ Form ============ */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        align-items: end;
      }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label {
        font-size: 12px;
        color: var(--color-text-muted);
        font-weight: 500;
      }
      input, select, textarea {
        font-family: inherit;
        font-size: 13px;
        padding: 9px 12px;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-sm);
        background: var(--color-bg);
        color: var(--color-text);
        transition: border-color 0.15s, box-shadow 0.15s;
        width: 100%;
      }
      /* iOS 16+ 的 select 弹层会继承 option 字号，移动端 11px 会缩成不可读的小字 */
      option { font-size: 16px; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--color-text);
        box-shadow: 0 0 0 3px var(--color-border);
      }
      textarea {
        min-height: 220px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        line-height: 1.6;
      }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; white-space: nowrap; }

      /* ============ Table ============ */
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface);
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td {
        padding: 12px 14px;
        text-align: left;
        vertical-align: middle;
        border-bottom: 1px solid var(--color-border);
      }
      thead th {
        background: var(--color-surface-2);
        font-weight: 500;
        color: var(--color-text-muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      tbody tr { transition: background 0.1s; }
      tbody tr:hover { background: var(--color-surface-hover); }
      tbody tr:last-child td { border-bottom: none; }

      /* ============ Badge ============ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        border: 1px solid transparent;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 2px color-mix(in oklab, currentColor 25%, transparent);
      }
      .badge.ok { background: var(--color-success-bg); color: var(--color-success); }
      .badge.bad { background: var(--color-danger-bg); color: var(--color-danger); }
      .badge.unknown { background: var(--color-surface-2); color: var(--color-text-soft); }

      /* ============ Toast ============ */
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 12px 18px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 500;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-lg);
        animation: toast-in 0.25s ease-out;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-width: min(420px, calc(100vw - 48px));
        white-space: pre-line;
        line-height: 1.5;
      }
      .toast.ok { color: var(--color-success); }
      .toast.err { color: var(--color-danger); }
      .toast::before {
        content: "";
        width: 8px;
        height: 8px;
        margin-top: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: currentColor;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ============ Login ============ */
      .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login-card {
        width: 100%;
        max-width: 380px;
        padding: 36px 32px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
      }
      .login-card .brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        text-align: center;
      }
      .login-card .subtitle {
        text-align: center;
        margin: 0 0 24px;
        color: var(--color-text-muted);
        font-size: 13px;
      }
      .login-card .btn-primary { width: 100%; padding: 11px; }

      /* ============ Tabs row (tabs + add button) ============ */
      .tabs-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .tabs-row .tabs { margin-bottom: 0; }
      .mode-selector { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .mode-label { font-size: 12px; color: var(--color-text-dim); }
      .mode-selector select {
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border-strong);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 13px;
      }

      /* ============ Modal ============ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 100;
        animation: fade-in 0.15s ease-out;
      }
      .modal {
        width: 100%;
        max-width: 440px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-lg);
        padding: 28px;
        animation: modal-in 0.2s ease-out;
      }
      .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      .modal-header h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .modal-body { display: flex; flex-direction: column; gap: 16px; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

      /* ============ Pagination ============ */
      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 0 0;
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .pager .btn { padding: 5px 12px; font-size: 12px; }

      .empty {
        text-align: center;
        padding: 56px 16px;
        color: var(--color-text-soft);
        font-size: 13px;
      }
      .empty-icon { font-size: 32px; opacity: 0.5; margin-bottom: 8px; }
      .danger-text {
        color: var(--color-danger);
        background: var(--color-danger-bg);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 12px;
      }
      .hint { color: var(--color-text-muted); font-size: 12px; }
      .stack-name { display: flex; flex-direction: column; gap: 2px; }
      .stack-name strong { font-weight: 600; letter-spacing: -0.01em; }
      td.mono { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .only-sm { display: none; }
      .col-actions { width: 1%; white-space: nowrap; }

      /* ============ Responsive ============ */
      @media (max-width: 768px) {
        header { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
        header h1 { font-size: 14px; }
        .stats { font-size: 10px; padding: 3px 8px; }
        main { padding: 16px; }

        .panel { padding: 16px; }
        .panel + .panel { margin-top: 12px; }
        .panel h2 { font-size: 13px; }

        .tabs { gap: 2px; padding: 3px; }
        .tabs button { padding: 6px 14px; font-size: 12px; }

        .tabs-row { flex-wrap: wrap; gap: 8px; }

        th, td { padding: 8px 10px; white-space: nowrap; }
        thead th { font-size: 10px; }

        .modal { padding: 20px; }
        .login-card { padding: 28px 24px; }

        .toolbar { flex-wrap: wrap; gap: 8px; }
        .form-grid { grid-template-columns: 1fr; }

        .table-wrap-nodes th:nth-child(4),
        .table-wrap-nodes td:nth-child(4) { display: none; }

        .col-actions { width: auto; }
        th:last-child, td:last-child {
          position: sticky;
          right: 0;
          background: var(--color-surface);
          box-shadow: -6px 0 8px -6px rgba(0, 0, 0, 0.18);
        }
        thead th:last-child { background: var(--color-surface-2); }

        .badge { font-size: 10px; padding: 2px 7px; }
      }

      @media (max-width: 480px) {
        header { padding: 8px 10px; gap: 6px; }
        header h1 { font-size: 13px; }
        header .btn-icon { padding: 5px 8px; font-size: 11px; }
        .stats { display: none; }
        .hide-sm { display: none; }
        .only-sm { display: inline; }

        main { padding: 10px; }
        .panel { padding: 12px; border-radius: var(--radius); }

        .tabs { padding: 2px; }
        .tabs button { padding: 5px 10px; font-size: 11px; }

        th, td { padding: 5px 5px; font-size: 10px; }
        thead th { font-size: 9px; }
        .badge::before { display: none; }
        .badge { padding: 2px 6px; }
        td.actions { gap: 4px; }

        .btn { font-size: 11px; padding: 6px 8px; }
        .btn-primary { padding: 7px 10px; font-size: 11px; }
        .btn-ghost, .btn-danger { font-size: 10px; padding: 4px 7px; }

        .mono { font-size: 9px; }

        .modal { padding: 12px; border-radius: var(--radius-lg); }
        .modal-header h3 { font-size: 13px; }
        .modal-header { margin-bottom: 14px; }
        .modal-body { gap: 10px; }
        .modal-footer { gap: 6px; }

        .login-card { padding: 16px 14px; }
        .login-card .brand { font-size: 18px; }
        .login-card .subtitle { font-size: 12px; }

        input, select { font-size: 11px; padding: 6px 8px; }

        .stack-name strong { font-size: 11px; }
        .stack-name .mono { display: none; }
        td.mono { max-width: 120px; }
        td.actions { flex-wrap: nowrap; }

        .hint { font-size: 10px; }
        .empty { padding: 32px 12px; font-size: 11px; }

        .table-wrap { border-radius: var(--radius-sm); }
        .table-wrap-embys:not(.editing) th:nth-child(3),
        .table-wrap-embys:not(.editing) td:nth-child(3) { display: none; }

        .toast {
          left: 12px;
          right: 12px;
          bottom: 12px;
          max-width: none;
          font-size: 12px;
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script>
      const $app = document.getElementById("app");
      const state = { tab: (v => ["embys", "nodes", "groups"].includes(v) ? v : "embys")(localStorage.getItem("emby-router-tab")), nodes: [], embys: [], groups: [], health: {}, proxyMode: "node", activeNodeId: "", theme: "auto", editingEmby: null, editingNode: null, embyPage: 0, nodePage: 0, diag: null };

      // ---------- 主题 ----------
      function applyTheme(mode) {
        state.theme = mode;
        localStorage.setItem("emby-router-theme", mode);
        const effective = mode === "auto"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        document.documentElement.setAttribute("data-theme", effective);
      }
      function nextTheme(cur) {
        return cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
      }
      function themeIcon(mode) {
        const label = mode === "auto" ? "系统" : mode === "light" ? "浅色" : "深色";
        const icon = mode === "auto" ? "🖥" : mode === "light" ? "☀️" : "🌙";
        return `${icon}<span class="hide-sm"> ${label}</span>`;
      }
      applyTheme(localStorage.getItem("emby-router-theme") || "auto");
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (state.theme === "auto") applyTheme("auto");
      });

      // ---------- 通用 ----------
      function toast(msg, type, ms) {
        const el = document.createElement("div");
        el.className = "toast " + (type === "err" ? "err" : "ok");
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), ms || 3500);
      }
      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
      }
      function relTime(iso) {
        if (!iso) return "-";
        const t = new Date(iso).getTime();
        if (Number.isNaN(t)) return iso;
        const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
        if (s < 60) return "刚刚";
        if (s < 3600) return Math.floor(s / 60) + " 分钟前";
        if (s < 86400) return Math.floor(s / 3600) + " 小时前";
        return Math.floor(s / 86400) + " 天前";
      }
      async function api(path, opts) {
        const resp = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        return data;
      }
      async function checkAuth() {
        try { await api("/emby/admin/api/me"); return true; }
        catch { return false; }
      }
      async function refreshAll() {
        const [n, e, h, c, g, d] = await Promise.all([
          api("/emby/admin/api/nodes"),
          api("/emby/admin/api/embys"),
          api("/emby/admin/api/health"),
          api("/emby/admin/api/config"),
          api("/emby/admin/api/groups"),
          api("/emby/admin/api/diag"),
        ]);
        state.nodes = n.nodes || [];
        state.embys = e.embys || [];
        state.groups = g.groups || [];
        state.health = h.nodes || {};
        state.proxyMode = c.proxy_mode || "node";
        state.activeNodeId = c.active_node_id || "";
        state.diag = d || null;
        render();
      }
      function nodeName(id) {
        if (!id) return "直连（无代理）";
        if (id === "local") return "本地代理（Worker）";
        const n = state.nodes.find((x) => x.id === id);
        return n ? n.name : id;
      }
      const ISP_LABELS = { ct: "电信", cu: "联通", cm: "移动", overseas: "海外" };
      // 网络标签用中性样式，避免与健康状态的绿/红徽章混淆
      const ISP_CHIP_STYLE = "border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);";
      function ispBadges(tags) {
        const list = tags || [];
        if (list.length === 0) return '<span class="badge unknown">未标注</span>';
        return list.map((t) =>
          `<span class="badge" style="${ISP_CHIP_STYLE}">${ISP_LABELS[t] || t}</span>`
        ).join(" ");
      }
      function groupName(id) {
        if (id == null) return null;
        const g = state.groups.find((x) => x.id === id);
        return g ? g.name : `组#${id}`;
      }
      function diagChip() {
        const d = state.diag;
        if (!d) return "";
        const label = ISP_LABELS[d.isp] || "海外";
        return `<span class="badge" title="ASN ${d.asn ?? "-"} · ${escapeHtml(d.as_organization || "")}" style="${ISP_CHIP_STYLE}">入口:${label}${d.asn ? ` · AS${d.asn}` : ""}</span>`;
      }
      function healthBadge(nodeId) {
        if (nodeId === "local") return '<span class="badge ok">本地</span>';
        const h = state.health[nodeId];
        if (!h) return '<span class="badge unknown">未检测</span>';
        if (h.healthy) return '<span class="badge ok">健康</span>';
        return '<span class="badge bad">异常</span>';
      }

      // 延迟/同步错误等明细不进表格，由探测 toast 承载
      function clip(s, n) {
        const v = String(s ?? "");
        return v.length > n ? v.slice(0, n) + "…" : v;
      }
      async function probeAndReport() {
        try {
          const h = await api("/emby/admin/api/probe", { method: "POST" });
          await refreshAll();
          const entries = Object.entries(h.nodes || {});
          if (entries.length === 0) {
            toast("探测完成：暂无节点", "ok");
            return;
          }
          const bad = entries.filter(([, v]) => !v.healthy);
          const lines = entries.map(([id, v]) =>
            `· ${nodeName(id)}：${v.healthy ? (v.last_latency_ms != null ? v.last_latency_ms + " ms" : "健康") : "异常"}`,
          );
          toast(
            `探测完成 ${entries.length - bad.length}/${entries.length} 健康\n` + lines.join("\n"),
            bad.length > 0 ? "err" : "ok",
            bad.length > 0 ? 8000 : 5000,
          );
        } catch (e) {
          toast(e.message, "err");
        }
      }
      // emby 页探测：报告节点 → emby 后端的 TCP 延迟（backend_latencies），
      // 与节点页的节点健康探测区分开
      async function probeEmbysAndReport() {
        try {
          const h = await api("/emby/admin/api/probe", { method: "POST" });
          await refreshAll();
          if (state.embys.length === 0) {
            toast("探测完成：暂无 emby", "ok");
            return;
          }
          let badCount = 0;
          const lines = state.embys.map((e) => {
            if (state.proxyMode === "direct") return `· ${e.name}：直连（不经代理）`;
            if (state.proxyMode === "local" || !state.activeNodeId) return `· ${e.name}：Worker 代理`;
            const ms = (h.nodes?.[state.activeNodeId]?.backend_latencies || {})[e.name];
            if (ms == null || ms < 0) {
              badCount++;
              return `· ${e.name}：不可达`;
            }
            return `· ${e.name}：${ms} ms`;
          });
          toast(
            "节点 → 后端延迟\n" + lines.join("\n"),
            badCount > 0 ? "err" : "ok",
            badCount > 0 ? 10000 : 6000,
          );
        } catch (e) {
          toast(e.message, "err");
        }
      }
      async function resyncAndReport() {
        try {
          const r = await api("/emby/admin/api/sync", { method: "POST" });
          await refreshAll();
          const results = r.push_results || [];
          const failed = results.filter((x) => x.status !== "ok");
          if (failed.length === 0) {
            toast(`已重推：${results.length}/${results.length} 成功`, "ok");
            return;
          }
          const lines = failed.map(
            (f) => `· ${nodeName(f.node_id)}：${clip(f.error || "未知错误", 120)}`,
          );
          toast(
            `重推失败 ${failed.length}/${results.length}\n` + lines.join("\n"),
            "err",
            10000,
          );
        } catch (e) {
          toast(e.message, "err");
        }
      }

      // ---------- 顶层 ----------
      function render() {
        if (!state.authed) return renderLogin();
        $app.innerHTML = `
          <header>
            <h1>🎬 Emby Router</h1>
            <span class="stats">embys ${state.embys.length} · nodes ${state.nodes.length} · groups ${state.groups.length}</span>
            ${diagChip()}
            <button class="btn btn-icon" id="btn-theme">${themeIcon(state.theme)}</button>
            <button class="btn btn-icon" id="btn-refresh">↻<span class="hide-sm"> 刷新</span></button>
            <button class="btn btn-icon" id="btn-logout">登出</button>
          </header>
          <main>
            <div class="tabs-row">
              <div class="tabs">
                <button data-tab="embys" class="${state.tab === "embys" ? "active" : ""}">Embys</button>
                <button data-tab="nodes" class="${state.tab === "nodes" ? "active" : ""}">Nodes</button>
                <button data-tab="groups" class="${state.tab === "groups" ? "active" : ""}">代理组</button>
              </div>
              <div class="mode-selector" title="全局模式；Node 档下，绑定代理组的 emby 走组内网络匹配 + 随机，未绑组的走全局节点"> 
                <label class="mode-label">模式</label>
                <select id="proxy-mode-select">
                  <option value="node" ${state.proxyMode === "node" ? "selected" : ""}>Node 代理</option>
                  <option value="local" ${state.proxyMode === "local" ? "selected" : ""}>Worker 代理</option>
                  <option value="direct" ${state.proxyMode === "direct" ? "selected" : ""}>直连</option>
                </select>
              </div>
              <button class="btn btn-primary" id="btn-add">${state.tab === "embys" ? "+ Emby" : state.tab === "groups" ? "+ 组" : "+ 节点"}</button>
            </div>
            <div id="tab-content"></div>
          </main>
        `;
        $app.querySelector("#btn-theme").onclick = () => { applyTheme(nextTheme(state.theme)); render(); };
        $app.querySelector("#btn-refresh").onclick = () => refreshAll().catch((e) => toast(e.message, "err"));
        $app.querySelector("#btn-logout").onclick = async () => {
          await fetch("/emby/admin/api/logout", { method: "POST" });
          state.authed = false;
          render();
        };
        $app.querySelectorAll(".tabs button").forEach((b) => {
          b.onclick = () => { state.tab = b.dataset.tab; localStorage.setItem("emby-router-tab", state.tab); render(); };
        });
        const modeSelect = $app.querySelector("#proxy-mode-select");
        if (modeSelect) {
          modeSelect.onchange = async () => {
            const newMode = modeSelect.value;
            try {
              await api("/emby/admin/api/config", {
                method: "PUT",
                body: JSON.stringify({ proxy_mode: newMode }),
              });
              state.proxyMode = newMode;
              toast(`已切换为 ${modeSelect.options[modeSelect.selectedIndex].text}`, "ok");
            } catch (e) {
              toast(e.message, "err");
              modeSelect.value = state.proxyMode;
            }
          };
        }
        $app.querySelector("#btn-add").onclick = () => {
          if (state.tab === "embys") openAddEmbyModal();
          else if (state.tab === "groups") openGroupModal(null);
          else openAddNodeModal();
        };
        if (state.tab === "embys") renderEmbys();
        else if (state.tab === "groups") renderGroups();
        else renderNodes();
      }

      function renderLogin() {
        $app.innerHTML = `
          <div class="login-shell">
            <div class="login-card">
              <h2 class="brand">🎬 Emby Router</h2>
              <p class="subtitle">输入 ADMIN_TOKEN 登录控制面</p>
              <div class="field" style="margin-bottom: 16px;">
                <input type="password" id="login-token" placeholder="ADMIN_TOKEN" autofocus />
              </div>
              <button class="btn btn-primary" id="btn-login">登录</button>
            </div>
          </div>
        `;
        $app.querySelector("#btn-login").onclick = async () => {
          const t = $app.querySelector("#login-token").value;
          try {
            await api("/emby/admin/api/login", { method: "POST", body: JSON.stringify({ token: t }) });
            state.authed = true;
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        $app.querySelector("#login-token").addEventListener("keydown", (e) => {
          if (e.key === "Enter") $app.querySelector("#btn-login").click();
        });
      }

      // ---------- Embys ----------
      function renderEmbys() {
        const c = $app.querySelector("#tab-content");
        const pageSize = 15;
        const totalPages = Math.max(1, Math.ceil(state.embys.length / pageSize));
        state.embyPage = Math.min(state.embyPage, totalPages - 1);
        const page = state.embyPage;
        const paged = state.embys.slice(page * pageSize, (page + 1) * pageSize);

        c.innerHTML = `
          <div class="panel">
            <div class="toolbar">
              <h2>Emby 列表</h2>
              <button class="btn btn-ghost" id="e-probe">⟳ 探测</button>
            </div>
            ${state.embys.length === 0
              ? '<div class="empty"><div class="empty-icon">📭</div>还没有 emby 配置</div>'
              : `<div class="table-wrap table-wrap-embys ${state.editingEmby ? "editing" : ""}"><table>
                  <thead><tr>
                    <th>名称</th><th>后端</th><th>代理组</th><th class="col-actions">操作</th>
                  </tr></thead>
                  <tbody>
                    ${paged.map((e) => {
                      const editing = state.editingEmby === e.name;
                      if (editing) {
                        return `
                          <tr data-name="${escapeHtml(e.name)}" data-mode="edit">
                            <td><input class="row-name" value="${escapeHtml(e.name)}" /></td>
                            <td><input class="row-backend mono" value="${escapeHtml(e.backend_url)}" /></td>
                            <td>
                              <select class="row-group">
                                <option value="">未绑定（全局节点）</option>
                                ${state.groups.map((g) =>
                                  `<option value="${g.id}" ${String(e.group_id) === String(g.id) ? "selected" : ""}>${escapeHtml(g.name)}</option>`
                                ).join("")}
                              </select>
                            </td>
                            <td class="actions">
                              <button class="btn btn-primary" data-act="save">保存</button>
                              <button class="btn btn-ghost" data-act="cancel">取消</button>
                            </td>
                          </tr>
                        `;
                      }
                      const gid = e.group_id;
                      const gname = groupName(gid);
                      return `
                        <tr data-name="${escapeHtml(e.name)}" data-mode="view">
                          <td><strong>${escapeHtml(e.name)}</strong></td>
                          <td class="mono">${escapeHtml(e.backend_url)}</td>
                          <td>${gname ? `<span class="badge" style="border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);">${escapeHtml(gname)}</span>` : '<span class="badge unknown">未绑定</span>'}</td>
                          <td class="actions">
                            <button class="btn btn-ghost" data-act="edit">编辑</button>
                            <button class="btn btn-danger" data-act="del">删除</button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>${totalPages > 1 ? `<div class="pager">
                  <button class="btn btn-ghost" id="eprev" ${page === 0 ? "disabled" : ""}>上一页</button>
                  <span>${page + 1} / ${totalPages}</span>
                  <button class="btn btn-ghost" id="enext" ${page >= totalPages - 1 ? "disabled" : ""}>下一页</button>
                </div>` : ""}</div>`
            }
          </div>
        `;

        const eprev = c.querySelector("#eprev");
        if (eprev) eprev.onclick = () => { state.embyPage--; render(); };
        const enext = c.querySelector("#enext");
        if (enext) enext.onclick = () => { state.embyPage++; render(); };

        c.querySelector("#e-probe").onclick = probeEmbysAndReport;

        c.querySelectorAll("tbody tr").forEach((tr) => {
          const name = tr.dataset.name;
          const mode = tr.dataset.mode;

          if (mode === "view") {
            tr.querySelector('[data-act="edit"]').onclick = () => {
              state.editingEmby = name;
              render();
            };
            tr.querySelector('[data-act="del"]').onclick = async () => {
              if (!confirm(`确认删除 emby '${name}'？`)) return;
              try {
                await api("/emby/admin/api/embys/" + encodeURIComponent(name), { method: "DELETE" });
                toast("已删除", "ok");
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
          } else {
            const $backend = tr.querySelector(".row-backend");
            tr.querySelector('[data-act="save"]').onclick = async () => {
              const newName = tr.querySelector(".row-name").value.trim();
              const newBackend = $backend.value.trim();
              if (!newBackend) { toast("backend_url 不能为空", "err"); return; }
              const $group = tr.querySelector(".row-group");
              const groupId = $group && $group.value !== "" ? Number($group.value) : null;
              try {
                await api("/emby/admin/api/embys/" + encodeURIComponent(name), {
                  method: "PUT",
                  body: JSON.stringify({ name: newName, backend_url: newBackend, group_id: groupId }),
                });
                toast(`已保存并推送：${newName}`, "ok");
                state.editingEmby = null;
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
            tr.querySelector('[data-act="cancel"]').onclick = () => {
              state.editingEmby = null;
              render();
            };
          }
        });
      }

      // ---------- Nodes（含 Health 列） ----------
      function renderNodes() {
        const c = $app.querySelector("#tab-content");
        const pageSize = 15;
        const totalPages = Math.max(1, Math.ceil(state.nodes.length / pageSize));
        state.nodePage = Math.min(state.nodePage, totalPages - 1);
        const page = state.nodePage;
        const paged = state.nodes.slice(page * pageSize, (page + 1) * pageSize);

        c.innerHTML = `
          <div class="panel">
            <div class="toolbar">
              <h2>节点列表</h2>
              <button class="btn btn-ghost" id="n-probe">⟳ 探测</button>
              <button class="btn btn-ghost" id="h-sync"><span class="hide-sm">↑ 重推所有节点</span><span class="only-sm">↑ 重推</span></button>
            </div>
            ${state.nodes.length === 0
              ? '<div class="empty"><div class="empty-icon">🖧</div>还没有节点</div>'
              : `<div class="table-wrap table-wrap-nodes"><table>
                  <thead><tr>
                    <th>节点</th>
                    <th>public_url</th>
                    <th>网络</th>
                    <th>状态</th>
                    <th>最近检测</th>
                    <th class="col-actions">操作</th>
                  </tr></thead>
                  <tbody>
                    ${paged.map((n, pi) => {
                      const h = state.health[n.id] || {};
                      const editing = state.editingNode === n.id;
                      const gi = page * pageSize + pi;
                      if (editing) {
                        return `
                          <tr data-id="${escapeHtml(n.id)}" data-mode="edit">
                            <td><div class="stack-name">
                              <input class="row-name" value="${escapeHtml(n.name)}" />
                            </div></td>
                            <td><input class="row-url mono" value="${escapeHtml(n.public_url)}" /></td>
                            <td>
                              <label class="hint" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:8px;"><input type="checkbox" class="n-isp" value="ct" ${(n.isp_tags || []).includes("ct") ? "checked" : ""} />电信</label>
                              <label class="hint" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:8px;"><input type="checkbox" class="n-isp" value="cu" ${(n.isp_tags || []).includes("cu") ? "checked" : ""} />联通</label>
                              <label class="hint" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:8px;"><input type="checkbox" class="n-isp" value="cm" ${(n.isp_tags || []).includes("cm") ? "checked" : ""} />移动</label>
                              <label class="hint" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" class="n-isp" value="overseas" ${(n.isp_tags || []).includes("overseas") ? "checked" : ""} />海外</label>
                            </td>
                            <td>${healthBadge(n.id)}</td>
                            <td title="${escapeHtml(h.last_check ?? "")}">${escapeHtml(relTime(h.last_check))}</td>
                            <td class="actions">
                              <button class="btn btn-primary" data-act="save">保存</button>
                              <button class="btn btn-ghost" data-act="cancel">取消</button>
                            </td>
                          </tr>
                        `;
                      }
                      return `
                        <tr data-id="${escapeHtml(n.id)}" data-mode="view">
                          <td><div class="stack-name">
                            <strong>${escapeHtml(n.name)}</strong>
                          </div></td>
                          <td class="mono" title="${escapeHtml(n.public_url)}">${escapeHtml(n.public_url)}</td>
                          <td>${ispBadges(n.isp_tags)}</td>
                          <td>${healthBadge(n.id)}</td>
                          <td title="${escapeHtml(h.last_check ?? "")}">${escapeHtml(relTime(h.last_check))}</td>
                          <td class="actions">
                            <button class="btn btn-ghost" data-act="up" ${gi === 0 ? "disabled" : ""} title="上移">↑</button>
                            <button class="btn btn-ghost" data-act="down" ${gi === state.nodes.length - 1 ? "disabled" : ""} title="下移">↓</button>
                            <button class="btn btn-ghost" data-act="edit">编辑</button>
                            <button class="btn btn-danger" data-act="del">删除</button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>${totalPages > 1 ? `<div class="pager">
                  <button class="btn btn-ghost" id="nprev" ${page === 0 ? "disabled" : ""}>上一页</button>
                  <span>${page + 1} / ${totalPages}</span>
                  <button class="btn btn-ghost" id="nnext" ${page >= totalPages - 1 ? "disabled" : ""}>下一页</button>
                </div>` : ""}</div>`

          </div>

        c.querySelector("#h-sync").onclick = resyncAndReport;
        c.querySelector("#n-probe").onclick = probeAndReport;

        const nprev = c.querySelector("#nprev");
        if (nprev) nprev.onclick = () => { state.nodePage--; render(); };
        const nnext = c.querySelector("#nnext");
        if (nnext) nnext.onclick = () => { state.nodePage++; render(); };

              state.editingNode = id;

              try {
                await api("/emby/admin/api/nodes/" + encodeURIComponent(id), { method: "DELETE" });

                await api("/emby/admin/api/nodes/" + encodeURIComponent(id), {
                  method: "PUT",
                  body: JSON.stringify({ name, public_url: url, isp_tags: ispTags }),
                });
                toast("已保存节点", "ok");
                state.editingNode = null;
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };

              state.editingNode = null;
              render();

      // ---------- 代理组（独立 Tab，样式与节点/emby 一致） ----------
      function renderGroups() {
        const c = $app.querySelector("#tab-content");
        c.innerHTML = `
          <div class="panel">
            <div class="toolbar">
              <h2>代理组列表</h2>
              <span class="hint">绑定组后 emby 按入口网络（电信/联通/移动）匹配组内 node 随机负载；未标注网络的 node 任何网络可选</span>

                    <th>组名</th><th>成员节点</th><th>创建时间</th><th class="col-actions">操作</th>
                  </tr></thead>
                  <tbody>
                    ${state.groups.map((g) => {

                      return `

                          <td class="actions">
                            <button class="btn btn-ghost" data-act="edit">编辑</button>
                            <button class="btn btn-danger" data-act="del">删除</button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table></div>`
            }
          </div>
        `;
        c.querySelectorAll("tbody tr").forEach((tr) => {
          const gid = Number(tr.dataset.gid);
          tr.querySelector('[data-act="edit"]').onclick = () => {
            const g = state.groups.find((x) => x.id === gid);
            if (g) openGroupModal(g);
          };
          tr.querySelector('[data-act="del"]').onclick = async () => {
            const g = state.groups.find((x) => x.id === gid);
            if (!g) return;
            if (!confirm(`确认删除组 '${g.name}'？绑定的 emby 将回到全局节点模式`)) return;
            try {
              await api("/emby/admin/api/groups/" + gid, { method: "DELETE" });
              toast("已删除组", "ok");
              await refreshAll();
            } catch (e) { toast(e.message, "err"); }
          };
        });
      }

      // 添加/编辑组弹窗：编辑态点保存才生效
      function openGroupModal(group) {
        const root = document.getElementById("modal-root");
        const isEdit = !!group;
        root.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>${isEdit ? "编辑组" : "添加组"}</h3>
                <button class="btn btn-icon" data-close>✕</button>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label>组名</label>
                  <input id="gm-name" value="${isEdit ? escapeHtml(group.name) : ""}" placeholder="例如 main" autofocus />
                </div>
                <div class="field">
                  <label>成员节点 <span class="hint">可多选；勾选后该组只在这些 node 上负载均衡</span></label>
                  ${state.nodes.length === 0
                    ? '<p class="hint" style="margin:0;">暂无节点，请先到 Nodes 页添加</p>'
                    : `<div style="display:flex;gap:8px 6px;flex-wrap:wrap;align-items:center;">
                        ${state.nodes.map((n) => `
                          <label title="${escapeHtml(n.name)}" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0;padding:4px 12px;border:1px solid var(--color-border-strong, rgba(128,128,128,.25));border-radius:999px;background:var(--color-surface);white-space:nowrap;font-size:12px;line-height:1.4;color:var(--color-text);">
                            <input type="checkbox" class="gm-member" data-nid="${escapeHtml(n.id)}" ${isEdit && (group.node_ids || []).includes(n.id) ? "checked" : ""} />
                            ${escapeHtml(n.name)}
                          </label>
                        `).join("")}
                      </div>`}
                </div>
                <div class="modal-footer">
                  <button class="btn btn-ghost" data-close>取消</button>
                  <button class="btn btn-primary" id="gm-save">保存</button>
                </div>
              </div>
            </div>
          </div>
        `;
        wireModal(root);
        root.querySelector("#gm-save").onclick = async () => {
          const name = (root.querySelector("#gm-name").value || "").trim();
          if (!name) { toast("组名不能为空", "err"); return; }
          const nodeIds = Array.from(root.querySelectorAll(".gm-member"))
            .filter((x) => x.checked)
            .map((x) => x.dataset.nid);
          try {
            if (isEdit) {
              await api("/emby/admin/api/groups/" + group.id, {
                method: "PUT",
                body: JSON.stringify({ name, node_ids: nodeIds }),
              });
              toast(`已保存组：${name}`, "ok");
            } else {
              await api("/emby/admin/api/groups", {
                method: "POST",
                body: JSON.stringify({ name, node_ids: nodeIds }),
              });
              toast(`已创建组：${name}`, "ok");
            }
            closeModal();
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        root.querySelector("#gm-name").addEventListener("keydown", (e) => {
          if (e.key === "Enter") root.querySelector("#gm-save").click();
        });
      }

      async function reorderNode(id, dir) {
        const ids = state.nodes.map((n) => n.id);
        const i = ids.indexOf(id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= ids.length) return;
        [ids[i], ids[j]] = [ids[j], ids[i]];
        try {
          await api("/emby/admin/api/nodes/reorder", {
            method: "POST",
            body: JSON.stringify({ ids }),
          });
          await refreshAll();
        } catch (e) { toast(e.message, "err"); }
      }


      // ---------- 弹窗 ----------
      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
      }
      function wireModal(root) {
        root.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeModal));
        root.querySelector(".modal-overlay").addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("modal-overlay")) closeModal();
        });
      }
      function openAddEmbyModal() {
        const root = document.getElementById("modal-root");
        root.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>添加 Emby</h3>
                <button class="btn btn-icon" data-close>✕</button>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label>emby_name <span class="hint">URL 第一段</span></label>
                  <input id="e-name" placeholder="例如 embyA" autofocus />
                </div>
                <div class="field">
                  <label>backend_url</label>
                  <input id="e-backend" placeholder="http://emby.internal:8096" />
                </div>
                <p class="hint" style="margin:0;">
                  URL: <span class="mono">https://入口域名/&lt;emby_name&gt;/...</span> →
                  代理模式由顶部全局设置决定（Node 代理 / Worker 代理 / 直连）
                </p>
                <div class="modal-footer">
                  <button class="btn btn-ghost" data-close>取消</button>
                  <button class="btn btn-primary" id="e-add">添加</button>
                </div>
              </div>
            </div>
          </div>
        `;
        wireModal(root);
        const submit = async () => {
          const name = root.querySelector("#e-name").value.trim();
          const backend = root.querySelector("#e-backend").value.trim();
          try {
            await api("/emby/admin/api/embys", { method: "POST", body: JSON.stringify({ name, backend_url: backend }) });
            toast("已添加并推送到所有节点", "ok");
            closeModal();
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        root.querySelector("#e-add").onclick = submit;
        root.querySelectorAll("#e-name, #e-backend").forEach((el) => {
          el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        });
      }
      function openAddNodeModal() {
        const root = document.getElementById("modal-root");
        root.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>添加节点</h3>
                <button class="btn btn-icon" data-close>✕</button>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label>节点名</label>
                  <input id="n-name" placeholder="例如 us-1" autofocus />
                </div>
                <div class="field">
                  <label>public_url</label>
                  <input id="n-url" placeholder="https://us.example.com" />
                </div>
                <div class="field">
                  <label>适合网络 <span class="hint">可多选；不选 = 任何网络均可服务</span></label>
                  <div style="display:flex;gap:8px 6px;flex-wrap:wrap;align-items:center;">
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;"><input type="checkbox" class="n-isp-new" value="ct" />电信</label>
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;"><input type="checkbox" class="n-isp-new" value="cu" />联通</label>
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;"><input type="checkbox" class="n-isp-new" value="cm" />移动</label>
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;"><input type="checkbox" class="n-isp-new" value="overseas" />海外</label>
                  </div>
                </div>
                <div class="modal-footer">
                  <button class="btn btn-ghost" data-close>取消</button>
                  <button class="btn btn-primary" id="n-add">添加</button>
                </div>
              </div>
            </div>
          </div>
        `;
        wireModal(root);
        const submit = async () => {
          const name = root.querySelector("#n-name").value.trim();
          const url = root.querySelector("#n-url").value.trim();
          const ispTags = Array.from(root.querySelectorAll(".n-isp-new"))
            .filter((x) => x.checked)
            .map((x) => x.value);
          try {
            await api("/emby/admin/api/nodes", { method: "POST", body: JSON.stringify({ name, public_url: url, isp_tags: ispTags }) });
            toast("已添加节点", "ok");
            closeModal();
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        root.querySelector("#n-add").onclick = submit;
        root.querySelectorAll("#n-name, #n-url").forEach((el) => {
          el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        });
      }

      // ---------- 启动 ----------
      (async () => {
        state.authed = await checkAuth();
        if (state.authed) await refreshAll();
        else render();
      })().catch((e) => toast(e.message, "err"));
    </script>
  </body>
</html>
