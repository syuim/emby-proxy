<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emby Router · 控制面</title>
    <style>
      /* ============ COSS UI 风设计令牌 ============ */
      :root {
        --color-bg: #fafafa;
        --color-surface: #ffffff;
        --color-surface-2: #f5f5f5;
        --color-surface-hover: #f0f0f0;
        --color-border: rgba(0, 0, 0, 0.08);
        --color-border-strong: rgba(0, 0, 0, 0.12);
        --color-text: #0a0a0a;
        --color-text-muted: #525252;
        --color-text-soft: #a3a3a3;
        --color-primary: #18181b;
        --color-primary-hover: #27272a;
        --color-primary-fg: #ffffff;
        --color-accent: #6366f1;
        --color-success: #16a34a;
        --color-success-bg: rgba(22, 163, 74, 0.1);
        --color-danger: #dc2626;
        --color-danger-bg: rgba(220, 38, 38, 0.1);
        --color-warn-bg: rgba(234, 179, 8, 0.12);

        --btn-from: #27272a;
        --btn-to: #0a0a0a;
        --btn-ring: rgba(0, 0, 0, 0.08);

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 16px;
        --radius-2xl: 20px;

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);

        --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -1px 0 rgba(0, 0, 0, 0.04);
        --btn-inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      }
      [data-theme="dark"] {
        --color-bg: #09090b;
        --color-surface: #18181b;
        --color-surface-2: #1f1f23;
        --color-surface-hover: #27272a;
        --color-border: rgba(255, 255, 255, 0.08);
        --color-border-strong: rgba(255, 255, 255, 0.14);
        --color-text: #fafafa;
        --color-text-muted: #a1a1aa;
        --color-text-soft: #71717a;
        --color-primary: #fafafa;
        --color-primary-hover: #ffffff;
        --color-primary-fg: #09090b;
        --color-accent: #818cf8;
        --color-success: #4ade80;
        --color-success-bg: rgba(74, 222, 128, 0.14);
        --color-danger: #f87171;
        --color-danger-bg: rgba(248, 113, 113, 0.14);
        --color-warn-bg: rgba(250, 204, 21, 0.14);

        --btn-from: #fafafa;
        --btn-to: #d4d4d8;
        --btn-ring: rgba(255, 255, 255, 0.06);

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.6);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);

        --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
        --btn-inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      }

      /* ============ 基础 ============ */
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Helvetica Neue", sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        transition: background 0.2s, color 0.2s;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      /* ============ Header ============ */
      header {
        background: color-mix(in oklab, var(--color-surface) 80%, transparent);
        border-bottom: 1px solid var(--color-border);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: saturate(180%) blur(12px);
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stats {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: var(--color-text-muted);
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
      }

      /* ============ 按钮 ============ */
      .btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        color: var(--color-text);
        transition: transform 0.08s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:active { transform: translateY(1px); }
      .btn-icon {
        background: var(--color-surface);
        border-color: var(--color-border);
        color: var(--color-text-muted);
        box-shadow: var(--shadow-xs);
      }
      .btn-icon:hover {
        color: var(--color-text);
        background: var(--color-surface-hover);
        border-color: var(--color-border-strong);
      }
      .btn-primary {
        background: linear-gradient(to bottom, var(--btn-from), var(--btn-to));
        color: var(--color-primary-fg);
        border-color: var(--btn-ring);
        box-shadow: var(--btn-inner-shadow), var(--shadow-sm);
        padding: 10px 16px;
        font-weight: 600;
      }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-ghost {
        background: var(--color-surface);
        border-color: var(--color-border);
        color: var(--color-text);
        font-size: 12px;
        padding: 6px 11px;
      }
      .btn-ghost:hover { background: var(--color-surface-hover); border-color: var(--color-border-strong); }
      .btn-danger {
        background: transparent;
        border-color: var(--color-border);
        color: var(--color-danger);
        font-size: 12px;
        padding: 6px 11px;
      }
      .btn-danger:hover { background: var(--color-danger-bg); border-color: var(--color-danger); }

      /* ============ 主区 ============ */
      main { max-width: 1200px; margin: 0 auto; padding: 28px; }

      /* ============ Tabs（segmented） ============ */
      .tabs {
        display: inline-flex;
        gap: 2px;
        margin-bottom: 20px;
        background: var(--color-surface);
        padding: 4px;
        border-radius: 999px;
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-xs);
      }
      .tabs button {
        background: transparent;
        border: none;
        padding: 7px 18px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--color-text-muted);
        border-radius: 999px;
        font-family: inherit;
        transition: all 0.15s;
      }
      .tabs button:hover { color: var(--color-text); }
      .tabs button.active {
        background: var(--color-primary);
        color: var(--color-primary-fg);
        box-shadow: var(--shadow-xs);
      }

      /* ============ Card / Panel ============ */
      .panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
      }
      .panel + .panel { margin-top: 16px; }
      .panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 18px;
        letter-spacing: -0.01em;
      }
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .toolbar h2 { margin: 0 !important; flex: 1; }

      /* ============ Form ============ */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        align-items: end;
      }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label {
        font-size: 12px;
        color: var(--color-text-muted);
        font-weight: 500;
      }
      input, select, textarea {
        font-family: inherit;
        font-size: 13px;
        padding: 9px 12px;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-sm);
        background: var(--color-bg);
        color: var(--color-text);
        transition: border-color 0.15s, box-shadow 0.15s;
        width: 100%;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--color-text);
        box-shadow: 0 0 0 3px var(--color-border);
      }
      textarea {
        min-height: 220px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        line-height: 1.6;
      }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      /* ============ Table ============ */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface);
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td {
        padding: 12px 14px;
        text-align: left;
        vertical-align: middle;
        border-bottom: 1px solid var(--color-border);
      }
      thead th {
        background: var(--color-surface-2);
        font-weight: 500;
        color: var(--color-text-muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      tbody tr { transition: background 0.1s; }
      tbody tr:hover { background: var(--color-surface-hover); }
      tbody tr:last-child td { border-bottom: none; }

      /* ============ Badge ============ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        border: 1px solid transparent;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 2px color-mix(in oklab, currentColor 25%, transparent);
      }
      .badge.ok { background: var(--color-success-bg); color: var(--color-success); }
      .badge.bad { background: var(--color-danger-bg); color: var(--color-danger); }
      .badge.unknown { background: var(--color-surface-2); color: var(--color-text-soft); }

      /* ============ Toast ============ */
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 12px 18px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 500;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-lg);
        animation: toast-in 0.25s ease-out;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toast.ok { color: var(--color-success); }
      .toast.err { color: var(--color-danger); }
      .toast::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ============ Login ============ */
      .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login-card {
        width: 100%;
        max-width: 380px;
        padding: 36px 32px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
      }
      .login-card .brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        text-align: center;
      }
      .login-card .subtitle {
        text-align: center;
        margin: 0 0 24px;
        color: var(--color-text-muted);
        font-size: 13px;
      }
      .login-card .btn-primary { width: 100%; padding: 11px; }

      /* ============ Tabs row (tabs + add button) ============ */
      .tabs-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .tabs-row .tabs { margin-bottom: 0; }

      /* ============ Modal ============ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 100;
        animation: fade-in 0.15s ease-out;
      }
      .modal {
        width: 100%;
        max-width: 440px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-lg);
        padding: 28px;
        animation: modal-in 0.2s ease-out;
      }
      .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      .modal-header h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .modal-body { display: flex; flex-direction: column; gap: 16px; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

      /* ============ Pagination ============ */
      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 0 0;
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .pager .btn { padding: 5px 12px; font-size: 12px; }

      .empty {
        text-align: center;
        padding: 56px 16px;
        color: var(--color-text-soft);
        font-size: 13px;
      }
      .empty-icon { font-size: 32px; opacity: 0.5; margin-bottom: 8px; }
      .danger-text {
        color: var(--color-danger);
        background: var(--color-danger-bg);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 12px;
      }
      .hint { color: var(--color-text-muted); font-size: 12px; }
      .stack-name { display: flex; flex-direction: column; gap: 2px; }
      .stack-name strong { font-weight: 600; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script>
      const $app = document.getElementById("app");
      const state = { tab: localStorage.getItem("emby-router-tab") === "nodes" ? "nodes" : "embys", nodes: [], embys: [], health: {}, theme: "auto", editingEmby: null, editingNode: null, embyPage: 0, nodePage: 0 };

      // ---------- 主题 ----------
      function applyTheme(mode) {
        state.theme = mode;
        localStorage.setItem("emby-router-theme", mode);
        const effective = mode === "auto"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        document.documentElement.setAttribute("data-theme", effective);
      }
      function nextTheme(cur) {
        return cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
      }
      function themeIcon(mode) {
        return mode === "auto" ? "🖥 系统" : mode === "light" ? "☀️ 浅色" : "🌙 深色";
      }
      applyTheme(localStorage.getItem("emby-router-theme") || "auto");
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (state.theme === "auto") applyTheme("auto");
      });

      // ---------- 通用 ----------
      function toast(msg, type) {
        const el = document.createElement("div");
        el.className = "toast " + (type === "err" ? "err" : "ok");
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }
      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
      }
      async function api(path, opts) {
        const resp = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        return data;
      }
      async function checkAuth() {
        try { await api("/admin/api/me"); return true; }
        catch { return false; }
      }
      async function refreshAll() {
        const [n, e, h] = await Promise.all([
          api("/admin/api/nodes"),
          api("/admin/api/embys"),
          api("/admin/api/health"),
        ]);
        state.nodes = n.nodes || [];
        state.embys = e.embys || [];
        state.health = h.nodes || {};
        render();
      }
      function nodeName(id) {
        const n = state.nodes.find((x) => x.id === id);
        return n ? n.name : id;
      }
      function healthBadge(nodeId) {
        const h = state.health[nodeId];
        if (!h) return '<span class="badge unknown">未检测</span>';
        if (h.healthy) return '<span class="badge ok">健康</span>';
        return '<span class="badge bad">异常</span>';
      }

      // ---------- 顶层 ----------
      function render() {
        if (!state.authed) return renderLogin();
        $app.innerHTML = `
          <header>
            <h1>🎬 Emby Router</h1>
            <span class="stats">embys ${state.embys.length} · nodes ${state.nodes.length}</span>
            <button class="btn btn-icon" id="btn-theme">${themeIcon(state.theme)}</button>
            <button class="btn btn-icon" id="btn-refresh">↻ 刷新</button>
            <button class="btn btn-icon" id="btn-logout">登出</button>
          </header>
          <main>
            <div class="tabs-row">
              <div class="tabs">
                <button data-tab="embys" class="${state.tab === "embys" ? "active" : ""}">Embys</button>
                <button data-tab="nodes" class="${state.tab === "nodes" ? "active" : ""}">Nodes</button>
              </div>
              <button class="btn btn-primary" id="btn-add">${state.tab === "embys" ? "+ Emby" : "+ 节点"}</button>
            </div>
            <div id="tab-content"></div>
          </main>
        `;
        $app.querySelector("#btn-theme").onclick = () => { applyTheme(nextTheme(state.theme)); render(); };
        $app.querySelector("#btn-refresh").onclick = () => refreshAll().catch((e) => toast(e.message, "err"));
        $app.querySelector("#btn-logout").onclick = async () => {
          await fetch("/admin/api/logout", { method: "POST" });
          state.authed = false;
          render();
        };
        $app.querySelectorAll(".tabs button").forEach((b) => {
          b.onclick = () => { state.tab = b.dataset.tab; localStorage.setItem("emby-router-tab", state.tab); render(); };
        });
        $app.querySelector("#btn-add").onclick = () => {
          if (state.tab === "embys") openAddEmbyModal();
          else openAddNodeModal();
        };
        if (state.tab === "embys") renderEmbys();
        else if (state.tab === "nodes") renderNodes();
      }

      function renderLogin() {
        $app.innerHTML = `
          <div class="login-shell">
            <div class="login-card">
              <h2 class="brand">🎬 Emby Router</h2>
              <p class="subtitle">输入 ADMIN_TOKEN 登录控制面</p>
              <div class="field" style="margin-bottom: 16px;">
                <input type="password" id="login-token" placeholder="ADMIN_TOKEN" autofocus />
              </div>
              <button class="btn btn-primary" id="btn-login">登录</button>
            </div>
          </div>
        `;
        $app.querySelector("#btn-login").onclick = async () => {
          const t = $app.querySelector("#login-token").value;
          try {
            await api("/admin/api/login", { method: "POST", body: JSON.stringify({ token: t }) });
            state.authed = true;
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        $app.querySelector("#login-token").addEventListener("keydown", (e) => {
          if (e.key === "Enter") $app.querySelector("#btn-login").click();
        });
      }

      // ---------- Embys ----------
      function renderEmbys() {
        const c = $app.querySelector("#tab-content");
        const optionsHtml = state.nodes.map((n) => `<option value="${escapeHtml(n.id)}">${escapeHtml(n.name)}</option>`).join("");
        const pageSize = 15;
        const totalPages = Math.max(1, Math.ceil(state.embys.length / pageSize));
        state.embyPage = Math.min(state.embyPage, totalPages - 1);
        const page = state.embyPage;
        const paged = state.embys.slice(page * pageSize, (page + 1) * pageSize);

        c.innerHTML = `
          <div class="panel">
            <div class="toolbar">
              <h2>Emby 列表</h2>
              <div id="batch-toolbar" class="actions" style="display:none;">
                <span class="hint" id="batch-count">已选 0 项</span>
                <select id="batch-node" style="width:auto;">${optionsHtml}</select>
                <button class="btn btn-primary" id="btn-batch">批量调整节点</button>
              </div>
            </div>
            ${state.embys.length === 0
              ? '<div class="empty"><div class="empty-icon">📭</div>还没有 emby 配置</div>'
              : `<div class="table-wrap"><table>
                  <thead><tr>
                    <th style="width:36px;"><input type="checkbox" id="select-all" /></th>
                    <th>名称</th><th>后端</th><th>节点</th><th>状态</th><th>后端延迟</th><th style="width:200px;">操作</th>
                  </tr></thead>
                  <tbody>
                    ${paged.map((e) => {
                      const h = state.health[e.node_id] || {};
                      const editing = state.editingEmby === e.name;
                      if (editing) {
                        return `
                          <tr data-name="${escapeHtml(e.name)}" data-mode="edit">
                            <td></td>
                            <td><input class="row-name" value="${escapeHtml(e.name)}" /></td>
                            <td><input class="row-backend mono" value="${escapeHtml(e.backend_url)}" /></td>
                            <td>
                              <select class="row-node">
                                ${state.nodes.map((n) => `<option value="${escapeHtml(n.id)}" ${n.id === e.node_id ? "selected" : ""}>${escapeHtml(n.name)}</option>`).join("")}
                              </select>
                            </td>
                            <td>${healthBadge(e.node_id)}</td>
                            <td class="mono">${h.backend_latencies?.[e.name] ?? "-"}${h.backend_latencies?.[e.name] != null ? " ms" : ""}</td>
                            <td class="actions">
                              <button class="btn btn-primary" data-act="save">保存</button>
                              <button class="btn btn-ghost" data-act="cancel">取消</button>
                            </td>
                          </tr>
                        `;
                      }
                      return `
                        <tr data-name="${escapeHtml(e.name)}" data-mode="view">
                          <td><input type="checkbox" class="row-select" data-name="${escapeHtml(e.name)}" /></td>
                          <td><strong>${escapeHtml(e.name)}</strong></td>
                          <td class="mono">${escapeHtml(e.backend_url)}</td>
                          <td>${escapeHtml(nodeName(e.node_id))}</td>
                          <td>${healthBadge(e.node_id)}</td>
                          <td class="mono">${h.backend_latencies?.[e.name] ?? "-"}${h.backend_latencies?.[e.name] != null ? " ms" : ""}</td>
                          <td class="actions">
                            <button class="btn btn-ghost" data-act="edit">编辑</button>
                            <button class="btn btn-danger" data-act="del">删除</button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>${totalPages > 1 ? `<div class="pager">
                  <button class="btn btn-ghost" id="eprev" ${page === 0 ? "disabled" : ""}>上一页</button>
                  <span>${page + 1} / ${totalPages}</span>
                  <button class="btn btn-ghost" id="enext" ${page >= totalPages - 1 ? "disabled" : ""}>下一页</button>
                </div>` : ""}</div>`
            }
          </div>
        `;

        const eprev = c.querySelector("#eprev");
        if (eprev) eprev.onclick = () => { state.embyPage--; render(); };
        const enext = c.querySelector("#enext");
        if (enext) enext.onclick = () => { state.embyPage++; render(); };

        c.querySelectorAll("tbody tr").forEach((tr) => {
          const name = tr.dataset.name;
          const mode = tr.dataset.mode;

          if (mode === "view") {
            tr.querySelector('[data-act="edit"]').onclick = () => {
              state.editingEmby = name;
              render();
            };
            tr.querySelector('[data-act="del"]').onclick = async () => {
              if (!confirm(`确认删除 emby '${name}'？`)) return;
              try {
                await api("/admin/api/embys/" + encodeURIComponent(name), { method: "DELETE" });
                toast("已删除", "ok");
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
          } else {
            const $backend = tr.querySelector(".row-backend");
            const $node = tr.querySelector(".row-node");
            tr.querySelector('[data-act="save"]').onclick = async () => {
              const newName = tr.querySelector(".row-name").value.trim();
              const newBackend = $backend.value.trim();
              const newNode = $node.value;
              if (!newBackend) { toast("backend_url 不能为空", "err"); return; }
              try {
                await api("/admin/api/embys/" + encodeURIComponent(name), {
                  method: "PUT",
                  body: JSON.stringify({ name: newName, backend_url: newBackend, node_id: newNode }),
                });
                toast(`已保存并推送：${newName}`, "ok");
                state.editingEmby = null;
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
            tr.querySelector('[data-act="cancel"]').onclick = () => {
              state.editingEmby = null;
              render();
            };
          }
        });

        // ---------- 多选批量调整 ----------
        function updateBatchToolbar() {
          const checked = c.querySelectorAll(".row-select:checked");
          const toolbar = c.querySelector("#batch-toolbar");
          const count = c.querySelector("#batch-count");
          if (checked.length === 0) {
            toolbar.style.display = "none";
          } else {
            toolbar.style.display = "flex";
            count.textContent = `已选 ${checked.length} 项`;
          }
        }

        const selectAll = c.querySelector("#select-all");
        if (selectAll) {
          selectAll.onclick = () => {
            const checked = selectAll.checked;
            c.querySelectorAll(".row-select").forEach(cb => cb.checked = checked);
            updateBatchToolbar();
          };
        }

        c.querySelectorAll(".row-select").forEach(cb => {
          cb.onclick = () => {
            if (selectAll) selectAll.checked = false;
            updateBatchToolbar();
          };
        });

        const batchBtn = c.querySelector("#btn-batch");
        if (batchBtn) {
          batchBtn.onclick = async () => {
            const checked = c.querySelectorAll(".row-select:checked");
            const names = Array.from(checked).map(cb => cb.dataset.name);
            const nodeId = c.querySelector("#batch-node").value;
            if (names.length === 0) { toast("请至少选择一个 emby", "err"); return; }
            if (!confirm(`将 ${names.length} 个 emby 的节点统一调整？`)) return;
            try {
              await api("/admin/api/embys", {
                method: "PUT",
                body: JSON.stringify({ names, node_id: nodeId }),
              });
              toast(`已更新 ${names.length} 个 emby 并推送到所有节点`, "ok");
              await refreshAll();
            } catch (e) { toast(e.message, "err"); }
          };
        }

        updateBatchToolbar();
      }

      // ---------- Nodes（含 Health 列） ----------
      function renderNodes() {
        const c = $app.querySelector("#tab-content");
        const pageSize = 15;
        const totalPages = Math.max(1, Math.ceil(state.nodes.length / pageSize));
        state.nodePage = Math.min(state.nodePage, totalPages - 1);
        const page = state.nodePage;
        const paged = state.nodes.slice(page * pageSize, (page + 1) * pageSize);

        c.innerHTML = `
          <div class="panel">
            <div class="toolbar">
              <h2>节点列表</h2>
              <button class="btn btn-ghost" id="h-sync">↑ 重推所有节点</button>
            </div>
            ${state.nodes.length === 0
              ? '<div class="empty"><div class="empty-icon">🖧</div>还没有节点</div>'
              : `<div class="table-wrap"><table>
                  <thead><tr>
                    <th>节点</th>
                    <th>public_url</th>
                    <th>默认</th>
                    <th>状态</th>
                    <th>延迟</th>
                    <th>连续失败</th>
                    <th>已应用 version</th>
                    <th>最近同步错误</th>
                    <th>最近检测</th>
                    <th style="width:90px;">操作</th>
                  </tr></thead>
                  <tbody>
                    ${paged.map((n) => {
                      const h = state.health[n.id] || {};
                      const editing = state.editingNode === n.id;
                      if (editing) {
                        return `
                          <tr data-id="${escapeHtml(n.id)}" data-mode="edit">
                            <td><div class="stack-name">
                              <input class="row-name" value="${escapeHtml(n.name)}" />
                              <span class="mono">${escapeHtml(n.id)}</span>
                            </div></td>
                            <td><input class="row-url mono" value="${escapeHtml(n.public_url)}" /></td>
                            <td><label style="display:flex;align-items:center;gap:6px;white-space:nowrap;">
                              <input type="checkbox" class="row-default" ${n.is_default ? "checked" : ""} style="width:auto;" /> 默认
                            </label></td>
                            <td>${healthBadge(n.id)}</td>
                            <td class="mono">${h.last_latency_ms ?? "-"}${h.last_latency_ms != null ? " ms" : ""}</td>
                            <td class="mono">${h.consecutive_fails ?? 0}</td>
                            <td class="mono">${h.applied_version ?? "-"}</td>
                            <td class="mono" style="max-width:240px;word-break:break-all;">${escapeHtml(h.last_sync_error ?? "-")}</td>
                            <td class="mono">${escapeHtml(h.last_check ?? "-")}</td>
                            <td class="actions">
                              <button class="btn btn-primary" data-act="save">保存</button>
                              <button class="btn btn-ghost" data-act="cancel">取消</button>
                            </td>
                          </tr>
                        `;
                      }
                      return `
                        <tr data-id="${escapeHtml(n.id)}" data-mode="view">
                          <td><div class="stack-name">
                            <strong>${escapeHtml(n.name)}</strong>
                            <span class="mono">${escapeHtml(n.id)}</span>
                          </div></td>
                          <td class="mono">${escapeHtml(n.public_url)}</td>
                          <td>${n.is_default ? '<span class="badge" style="background:var(--color-accent);color:#fff;padding:2px 8px;font-size:10px;">是</span>' : ""}</td>
                          <td>${healthBadge(n.id)}</td>
                          <td class="mono">${h.last_latency_ms ?? "-"}${h.last_latency_ms != null ? " ms" : ""}</td>
                          <td class="mono">${h.consecutive_fails ?? 0}</td>
                          <td class="mono">${h.applied_version ?? "-"}</td>
                          <td class="mono" style="max-width:240px;word-break:break-all;">${escapeHtml(h.last_sync_error ?? "-")}</td>
                          <td class="mono">${escapeHtml(h.last_check ?? "-")}</td>
                          <td class="actions">
                            <button class="btn btn-ghost" data-act="edit">编辑</button>
                            <button class="btn btn-danger" data-act="del">删除</button>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>${totalPages > 1 ? `<div class="pager">
                  <button class="btn btn-ghost" id="nprev" ${page === 0 ? "disabled" : ""}>上一页</button>
                  <span>${page + 1} / ${totalPages}</span>
                  <button class="btn btn-ghost" id="nnext" ${page >= totalPages - 1 ? "disabled" : ""}>下一页</button>
                </div>` : ""}</div>`
            }
          </div>
        `;
        c.querySelector("#h-sync").onclick = async () => {
          try {
            const r = await api("/admin/api/sync", { method: "POST" });
            const ok = r.push_results.filter((x) => x.status === "ok").length;
            const total = r.push_results.length;
            toast(`已重推：${ok}/${total} 成功`, ok === total ? "ok" : "err");
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };

        const nprev = c.querySelector("#nprev");
        if (nprev) nprev.onclick = () => { state.nodePage--; render(); };
        const nnext = c.querySelector("#nnext");
        if (nnext) nnext.onclick = () => { state.nodePage++; render(); };

        c.querySelectorAll("tbody tr").forEach((tr) => {
          const id = tr.dataset.id;
          const mode = tr.dataset.mode;
          if (mode === "view") {
            tr.querySelector('[data-act="edit"]').onclick = () => {
              state.editingNode = id;
              render();
            };
            tr.querySelector('[data-act="del"]').onclick = async () => {
              if (!confirm("确认删除节点？")) return;
              try {
                await api("/admin/api/nodes/" + encodeURIComponent(id), { method: "DELETE" });
                toast("已删除", "ok");
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
          } else {
            const $name = tr.querySelector(".row-name");
            const $url = tr.querySelector(".row-url");
            tr.querySelector('[data-act="save"]').onclick = async () => {
              const name = $name.value.trim();
              const url = $url.value.trim();
              const isDefault = tr.querySelector(".row-default").checked;
              if (!name || !url) { toast("名称与 public_url 不能为空", "err"); return; }
              try {
                await api("/admin/api/nodes/" + encodeURIComponent(id), {
                  method: "PUT",
                  body: JSON.stringify({ name, public_url: url, is_default: isDefault }),
                });
                toast("已保存节点", "ok");
                state.editingNode = null;
                await refreshAll();
              } catch (e) { toast(e.message, "err"); }
            };
            tr.querySelector('[data-act="cancel"]').onclick = () => {
              state.editingNode = null;
              render();
            };
          }
        });
      }


      // ---------- 弹窗 ----------
      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
      }
      function wireModal(root) {
        root.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeModal));
        root.querySelector(".modal-overlay").addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("modal-overlay")) closeModal();
        });
      }
      function openAddEmbyModal() {
        const noNodes = state.nodes.length === 0;
        const optionsHtml = state.nodes.map((n) => `<option value="${escapeHtml(n.id)}">${escapeHtml(n.name)}</option>`).join("");
        const root = document.getElementById("modal-root");
        root.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>添加 Emby</h3>
                <button class="btn btn-icon" data-close>✕</button>
              </div>
              ${noNodes
                ? '<div class="danger-text">请先到 Nodes 页添加至少一个节点</div>'
                : `<div class="modal-body">
                    <div class="field">
                      <label>emby_name <span class="hint">URL 第一段</span></label>
                      <input id="e-name" placeholder="例如 embyA" autofocus />
                    </div>
                    <div class="field">
                      <label>backend_url</label>
                      <input id="e-backend" placeholder="http://emby.internal:8096" />
                    </div>
                    <div class="field">
                      <label>节点</label>
                      <select id="e-node">${optionsHtml}</select>
                    </div>
                    <p class="hint" style="margin:0;">
                      URL: <span class="mono">https://入口域名/&lt;emby_name&gt;/...</span> →
                      307 转所选节点；不健康时随机切到其他健康节点
                    </p>
                    <div class="modal-footer">
                      <button class="btn btn-ghost" data-close>取消</button>
                      <button class="btn btn-primary" id="e-add">添加</button>
                    </div>
                  </div>`}
            </div>
          </div>
        `;
        wireModal(root);
        if (!noNodes) {
          const submit = async () => {
            const name = root.querySelector("#e-name").value.trim();
            const backend = root.querySelector("#e-backend").value.trim();
            const nodeId = root.querySelector("#e-node").value;
            try {
              await api("/admin/api/embys", { method: "POST", body: JSON.stringify({ name, backend_url: backend, node_id: nodeId }) });
              toast("已添加并推送到所有节点", "ok");
              closeModal();
              await refreshAll();
            } catch (e) { toast(e.message, "err"); }
          };
          root.querySelector("#e-add").onclick = submit;
          root.querySelectorAll("#e-name, #e-backend").forEach((el) => {
            el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
          });
        }
      }
      function openAddNodeModal() {
        const root = document.getElementById("modal-root");
        root.innerHTML = `
          <div class="modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3>添加节点</h3>
                <button class="btn btn-icon" data-close>✕</button>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label>节点名</label>
                  <input id="n-name" placeholder="例如 us-1" autofocus />
                </div>
                <div class="field">
                  <label>public_url</label>
                  <input id="n-url" placeholder="https://us.example.com" />
                </div>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;">
                  <input type="checkbox" id="n-default" style="width:auto;" /> 默认节点
                </label>
                <div class="modal-footer">
                  <button class="btn btn-ghost" data-close>取消</button>
                  <button class="btn btn-primary" id="n-add">添加</button>
                </div>
              </div>
            </div>
          </div>
        `;
        wireModal(root);
        const submit = async () => {
          const name = root.querySelector("#n-name").value.trim();
          const url = root.querySelector("#n-url").value.trim();
          const isDefault = root.querySelector("#n-default").checked;
          try {
            await api("/admin/api/nodes", { method: "POST", body: JSON.stringify({ name, public_url: url, is_default: isDefault }) });
            toast("已添加节点", "ok");
            closeModal();
            await refreshAll();
          } catch (e) { toast(e.message, "err"); }
        };
        root.querySelector("#n-add").onclick = submit;
        root.querySelectorAll("#n-name, #n-url").forEach((el) => {
          el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        });
      }

      // ---------- 启动 ----------
      (async () => {
        state.authed = await checkAuth();
        if (state.authed) await refreshAll();
        else render();
      })().catch((e) => toast(e.message, "err"));
    </script>
  </body>
</html>
