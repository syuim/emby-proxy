name = "emby-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-25"
# TMDB API 也托管在 Cloudflare 上，Worker→Worker 子请求会被拦截报 1042；
# 此 flag 让子请求严格走公网，绕开该限制
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
account_id = "9a2c5f84e3346b4d2310792e4f759881"

# D1 数据库（强一致）
[[d1_databases]]
binding = "EMBY_DB"
database_name = "emby-proxy"
database_id = "a4c1dbf8-e140-4612-86fe-d7e83dafc59b"

# 健康检测：每 5 分钟跑一次
[triggers]
crons = ["*/5 * * * *"]

# 可观测性：开启日志采集（全量采样），traces 不启用
# head_sampling_rate 只声明一次（顶层即日志采样率，默认 1=100%），嵌套 logs 无需重复
[observability]
enabled = true
head_sampling_rate = 1
[observability.logs]
enabled = true
invocation_logs = true

# Secrets（用 `wrangler secret put <NAME>` 写入，不要写在这里）：
#   ADMIN_TOKEN       管理 UI 登录与 import 接口
#   EMBY_SYNC_TOKEN   与所有节点共享，推 /admin/sync 时用
