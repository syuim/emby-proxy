name = "emby-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-25"
# TMDB API 也托管在 Cloudflare 上，Worker→Worker 子请求会被拦截报 1042；
# 此 flag 让子请求严格走公网，绕开该限制
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
account_id = "9a2c5f84e3346b4d2310792e4f759881"

# Placement：强制跑到法兰克福机房（FRA），对应用户需求——Worker 固定跑在德国
# region 用 aws:eu-central-1（法兰克福区域），CF 会部署到离该区域最近的机房（FRA）
# 注意：wrangler deploy 不应用 placement（script 级设置），需线上 API PATCH settings 生效；
# toml 配置用于文档化 + script 重建时自动应用
[placement]
mode = "targeted"
region = "aws:eu-central-1"

# D1 数据库（强一致）
[[d1_databases]]
binding = "EMBY_DB"
database_name = "emby-proxy"
database_id = "a4c1dbf8-e140-4612-86fe-d7e83dafc59b"

# 健康检测：每 5 分钟跑一次
[triggers]
crons = ["*/5 * * * *"]

# 可观测性：开启日志采集（全量采样），traces 不启用
# head_sampling_rate 只声明一次（顶层即日志采样率，默认 1=100%），嵌套 logs 无需重复
[observability]
enabled = true
head_sampling_rate = 1
[observability.logs]
enabled = true
invocation_logs = true

# Secrets（用 `wrangler secret put <NAME>` 写入，不要写在这里）：
#   ADMIN_TOKEN       管理 UI 登录与 import 接口
#   EMBY_SYNC_TOKEN   与所有节点共享，推 /admin/sync 时用
