services:
  emby-proxy:
    build: .
    restart: unless-stopped
    environment:
      EMBY_SYNC_TOKEN: ${EMBY_SYNC_TOKEN}
      EMBY_PROXY_PORT: "8080"
      EMBY_DATA_DIR: /app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./data:/app/data
